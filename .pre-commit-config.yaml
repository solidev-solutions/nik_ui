repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
        # Search for conflict markers on every run. By default the hook only searches while git is merging.
        args: [--assume-in-merge]
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse

  # These hooks run the tools package.json installs, so they need `npm ci` first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: npx --no-install prettier --write --ignore-unknown
        files: '\.(vue|ts|mts|tsx|js|css)$'

      # The same files eslint.config.js names.
      - id: eslint
        name: eslint
        language: system
        entry: npx --no-install eslint --max-warnings 0
        files: '\.(vue|ts|mts|tsx)$'

      - id: type-check
        name: vue-tsc
        language: system
        entry: npm run typecheck
        pass_filenames: false
        files: '\.(vue|ts|mts|tsx)$'

      # Builds the package, checks what would be published and builds an app that has it installed.
      - id: package
        name: package
        language: system
        entry: npm test
        pass_filenames: false
        files: '^(src|test)/|^(package(-lock)?\.json|(build|vitest)\.config\.ts)$'

  - repo: local
    hooks:
      - id: no-docs
        name: "No documentation files"
        language: fail
        entry: "No docs/ folder. Markdown is limited to README.md, SECURITY.md, AGENTS.md and CLAUDE.md."
        files: '^docs/|\.md$'
        exclude: '^(README|SECURITY|AGENTS|CLAUDE)\.md$'
