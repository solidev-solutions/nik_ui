default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  # These hooks run the tools package.json installs, so they need `npm ci` first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: npx --no-install prettier --write --ignore-unknown
        types_or: [javascript, ts, vue, css]

      - id: eslint
        name: eslint
        language: system
        entry: npx --no-install eslint --max-warnings 0
        types_or: [ts, vue]

      - id: type-check
        name: vue-tsc
        language: system
        entry: npx --no-install vue-tsc --noEmit
        pass_filenames: false
        types_or: [ts, vue]
