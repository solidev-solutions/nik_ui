repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
        # Without this the hook only looks while a merge is under way, so never in a pull request.
        args: [--assume-in-merge]
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  # These hooks run the tools package.json installs, so they need `npm ci` first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: npx --no-install prettier --write --ignore-unknown
        files: '\.(vue|ts|mts|tsx|js|css)$'

      # The same files eslint.config.js names.
      - id: eslint
        name: eslint
        language: system
        entry: npx --no-install eslint --max-warnings 0
        files: '\.(vue|ts|mts|tsx)$'

      - id: type-check
        name: vue-tsc
        language: system
        entry: npx --no-install vue-tsc --noEmit
        pass_filenames: false
        files: '\.(vue|ts|mts|tsx)$'
