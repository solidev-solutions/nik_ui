version: 2
# Every entry proposes a version once it is seven days old. Security updates do not wait.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      development:
        patterns: ["*"]
    ignore:
      # typescript-eslint and vue-tsc do not run on TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/.github/release"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      release-tools:
        patterns: ["*"]
    ignore:
      # A pull request cannot try a release. A major version is raised by hand and tried with a dry run.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      pre-commit:
        patterns: ["*"]
