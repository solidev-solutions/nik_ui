name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm ci --ignore-scripts

      # The library is tested in it.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Every check is a hook in .pre-commit-config.yaml, so this runs what a commit runs.
      - uses: pre-commit/action@v3.0.1
