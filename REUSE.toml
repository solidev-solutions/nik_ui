version = 1

# Configuration, project text and the tests belong to this repository as a whole. A file in src/
# is not listed here: it names its copyright holders and its license in its first lines, so a
# port carries the name of its original.
[[annotations]]
path = ["*", ".github/**", ".claude/**", "test/**"]
SPDX-FileCopyrightText = "2026 Solidev - Thomas Liska"
SPDX-License-Identifier = "MIT"

# Inter, cut for the theme, keeps its authors' license; its text ships beside the font files.
# Override: the wording of that text would otherwise be read as copyright notices of its own.
[[annotations]]
path = "src/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# The notice names the copyright holders of what was ported. Override: their lines would otherwise
# be read as the notice's own.
[[annotations]]
path = "NOTICE"
precedence = "override"
SPDX-FileCopyrightText = "2026 Solidev - Thomas Liska"
SPDX-License-Identifier = "MIT"
