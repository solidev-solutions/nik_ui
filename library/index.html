<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NichtImKopf UI</title>
    <!-- Before the app starts, so a dark page does not open white: the script sets the theme the
         color mode button last kept, which VueUse keeps under this key, or the system's. Nuxt UI's
         colors come with the app; until then the style lets the browser's own dark background
         stand in. -->
    <script>
      {
        const mode = localStorage.getItem('vueuse-color-scheme') ?? 'auto'
        const dark =
          mode === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : mode === 'dark'
        document.documentElement.classList.toggle('dark', dark)
      }
    </script>
    <style>
      html.dark {
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
